<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sushma Matrimony</title>

    <!-- IMPORTANT: style.css is in the main GitHub folder -->
    <link rel="stylesheet" href="style.css">

    <!-- Elegant script font similar to Balmoral -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ballet&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <!-- NAVBAR -->
    <header class="login-header">
        <nav class="navbar">

            <div class="logo">
                💍
                <span>Sushma Matrimony</span>
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
            </div>

        </nav>
    </header>


    <!-- LOGIN SECTION -->
    <main class="login-container">

        <!-- LEFT SIDE -->
        <section class="login-image">

            <div class="image-overlay">

                <div class="heart-icon">♥</div>

                <h1>Sushma</h1>

                <h2>Matrimony</h2>

                <p>
                    Where two hearts meet and
                    beautiful journeys begin.
                </p>

                <div class="small-hearts">
                    ♥ ♥ ♥
                </div>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="login-form-section">

            <div class="login-card">

                <div class="login-icon">
                    💍
                </div>

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Login to your Sushma Matrimony account
                </p>


                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <div class="input-box">

                            <span>✉</span>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="input-box">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <!-- REMEMBER + FORGOT -->
                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>Remember me</span>

                        </label>

                        <a href="#" class="forgot">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Login
                        <span>→</span>
                    </button>

                </form>


                <!-- REGISTER -->
                <div class="register-section">

                    <p>
                        Don't have an account?
                    </p>

                    <a
                        href="register.html"
                        class="create-profile"
                    >
                        Create Your Profile
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="login-footer">

        <p>
            © 2026 Sushma Matrimony
        </p>

        <p>
            Made with ♥ for beautiful beginnings
        </p>

    </footer>


    <!-- FIREBASE / LOGIN JAVASCRIPT WILL GO HERE -->
    <script src="script.js"></script>

</body>
</html>
