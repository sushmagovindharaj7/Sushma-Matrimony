<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Sushma Matrimony</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            💍 Sushma Matrimony
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>

</header>


<section class="login-section">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login to your Sushma Matrimony account.</p>


        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</section>


<script src="js/script.js"></script>

</body>

</html>
