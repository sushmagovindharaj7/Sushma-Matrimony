
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Sushma Matrimony</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            💍 Sushma Matrimony
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>
</header>


<section class="registration">

    <div class="registration-box">

        <h1>Create Your Profile</h1>

        <p>
            Join Sushma Matrimony and start your journey.
        </p>


        <form id="registrationForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <label>Gender</label>

            <select id="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>


            <label>Date of Birth</label>

            <input
                type="date"
                id="dob"
                required
            >


            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >


            <label>Religion</label>

            <select id="religion" required>

                <option value="">
                    Select Religion
                </option>

                <option value="Hindu">
                    Hindu
                </option>

                <option value="Christian">
                    Christian
                </option>

                <option value="Muslim">
                    Muslim
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Education</label>

            <input
                type="text"
                id="education"
                placeholder="Example: B.E Computer Science"
            >


            <label>Occupation</label>

            <input
                type="text"
                id="occupation"
                placeholder="Example: Software Engineer"
            >


            <label>About Yourself</label>

            <textarea
                id="about"
                rows="4"
                placeholder="Tell us about yourself"
            ></textarea>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<!-- Firebase + Website JavaScript -->
<script type="module" src="script.js"></script>

</body>

</html>
